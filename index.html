<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yankaifeng70的技术博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #ff2222;
            font-family: "Consolas", "Monaco", monospace;
            line-height: 1.6;
            position: relative;
            min-height: 100vh;
        }
        /* CRT扫描线 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(100,0,0,0.12),
                rgba(100,0,0,0.12) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 99;
        }
        .banner {
            background: linear-gradient(#200000, #000000);
            text-align: center;
            padding: 120px 20px;
            border-bottom: 1px solid #ff2222;
            position: relative;
        }
        .banner h1 {
            font-size: clamp(32px, 8vw, 80px);
            text-shadow: 0 0 8px #ff2222, 0 0 16px #990000;
            animation: flicker 4s infinite alternate;
        }
        .banner p {
            margin-top:16px;
            font-size:20px;
            color:#ff6666;
        }
        @keyframes flicker {
            0% { opacity: 0.9; }
            50% { opacity: 1; }
            100% { opacity: 0.95; }
        }
        .post-list {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .post-item {
            font-size: clamp(20px, 4vw, 40px);
            font-weight: bold;
            margin-bottom: 24px;
            padding: 12px;
            border-left: 3px solid #ff2222;
            transition: all 0.3s;
        }
        .post-item:hover {
            background-color: rgba(255, 34, 34, 0.08);
            border-left-color: #ff7777;
        }
        .post-item a {
            color: #ff2222;
            text-decoration: none;
            text-shadow: 0 0 4px #ff2222;
            transition: all 0.3s;
        }
        .post-item a:hover {
            color: #ff7777;
            text-shadow: 0 0 8px #ff4444, 0 0 16px #ff4444;
        }
        .footer {
            text-align: center;
            padding: 40px;
            color: #772222;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <h1>yankaifeng70@blog:~$</h1>
        <p>Welcome to my security blog</p>
    </div>

    <div class="post-list">
        <div class="post-item"><a href="blog.html">task01 我的第一篇博客</a></div>
        <div class="post-item"><a href="bugku.html">bugku</a></div>
    </div>

    <div class="footer">
        © 2026 yankaifeng70 | Hacker Terminal Theme
    </div>
</body>
</html>
