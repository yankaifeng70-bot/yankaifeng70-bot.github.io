<h3>操作步骤</h3>
1. 打开题目页面，按 Ctrl+U 查看网页源代码。
2. 查找JS代码，找到变量 mixlegth = 1。
3. 原理：JS逻辑判断输入的数字和 mixlegth 进行对比，原始值是1，我们需要把这个值修改为2。

<h3>踩坑点</h3>

<h2>4、alert｜ctrl+U查看代码翻到最下面找到HTML实体</h2>
<h3>题目描述</h3>
页面打开会弹出alert弹窗，但是弹窗内容不是flag，源代码底部有一堆 &#数字; 的字符。
<h3>解题思路</h3>
考点：HTML实体编码。&#十进制数字; 是HTML字符实体，每一串数字对应一个ASCII字符，浏览器会自动解码渲染。例如 &#97; 对应字母 a。
<h3>操作步骤</h3>
1. 访问页面，Ctrl+U 查看源代码，滚动到页面最底部，复制全部 &#xxx; 编码串。
2. 解码方式任选其一：
    - 方法1：把编码粘贴到HTML文件中，用浏览器打开，浏览器自动解析HTML实体，直接显示明文。
    - 方法2：使用在线HTML实体解码工具，粘贴编码一键解码。
    - 方法3：Python脚本解码：
<pre>
import html
code = "这里粘贴&#数字;字符串"
print(html.unescape(code))
</pre>
3. 解码完成得到flag。
<h3>踩坑点</h3>
不要手动一个个数字查表，量大容易出错；注意区分HTML实体和URL编码。

6:`
<h2>6、头等舱｜F12切换到网络刷新在响应标头里找到flag</h2>
<h3>题目描述</h3>
页面看起来普通，页面正文没有flag，flag藏在HTTP响应头（Response Headers）中。
<h3>知识点：HTTP头</h3>
浏览器访问网站，服务器返回资源的时候，会附带HTTP响应头，用来传递元信息（服务器版本、cookie、自定义信息等）。响应头不属于网页正文，所以页面上看不到。
<h3>操作步骤</h3>

3. 按下F5刷新页面，此时会捕获本次HTTP请求。
4. 在请求列表点击页面主请求，右侧切换到【Response Headers（响应标头）】。
5. 在响应头列表向下查找，找到自定义头部，里面存放flag。
<h3>踩坑点</h3>
区分：Request Headers（请求头，浏览器发给服务器）、Response Headers（响应头，服务器返回浏览器），flag在响应头，不要看反。

<h2>7、post｜构造POST请求，what=flag</h2>
<h3>题目描述</h3>
题目提示需要POST方式提交参数 what，值为 flag，页面没有现成表单，无法直接在网页提交。
> GET：参数放在URL里；POST：参数放在请求体中，不在URL显示。
<h3>解题思路</h3>
两种解法：①自制HTML表单提交；②用Burp/Curl构造POST请求。这里写题目提到的HTML表单方案。
<h3>操作步骤（HTML表单方法）</h3>
1. 在电脑新建文本文档，写入下面代码：
<pre>
&lt;form method="post" action="http://160.202.254.160:16740/"&gt;
&lt;input name="what" type="text"&gt;
&lt;input type="submit" value="提交"&gt;
&lt;/form&gt;
</pre>
2. 文件另存为，文件名填写 post.html，编码选择UTF-8，保存类型：所有文件。
3. 关闭记事本，双击 post.html 使用浏览器打开。
4. 在输入框填入 flag，点击提交按钮。
5. 服务器接收POST参数 what=flag，页面返回flag。
<h3>备选方案 curl命令（kali/Windows终端）</h3>
<pre>curl -X POST -d "what=flag" http://160.202.254.160:16740/</pre>
<h3>考点总结</h3>
GET与POST请求区别，手动构造POST表单提交。
<h3>踩坑点</h3>
- action地址必须写对，IP端口不能写错；
- form的method必须是 post，不能写成get；
- input的name必须是 what，name是提交参数名，写错服务器接收不到。

<pre>git log</pre>

<pre>git checkout 提交哈希值</pre>
6. 查看目录下文件，读取文件得到flag。

网站源码泄露漏洞，git版本控制系统原理。
<h3>踩坑点</h3>
很多人只会看当前版本文件，flag存在历史提交记录，当前最新版本文件已经删除flag，必须回滚历史commit。

<h2>12、聪明的小羊｜栅栏密码（2栏）</h2>
<h3>题目描述</h3>
给出密文，提示栅栏密码，2栏。
<h3>栅栏密码原理</h3>
把明文分成上下两行，按行拼接得到密文；解密就是把密文重新拆分，交替读取字符还原明文。
> 2栏栅栏：
明文：abcdef
分成两行：
a c e
b d f
密文=acebdf
解密操作：密文 acebdf，长度6，前半放第一行，后半放第二行，依次取每行第一个字符 a b c d e f。
<h3>本题示例：</h3>
密文：fa{fe13f590lg6d46d0d0}
2栏栅栏解密后得到：flag{6fde4163df05d900}
<h3>操作步骤</h3>
1. 复制密文，使用在线【2栏栅栏密码解密工具】。
2. 栏数选择 2，解密得到明文flag。
<h3>踩坑点</h3>
栅栏密码栏数是关键，本题固定2栏；不要和凯撒、维吉尼亚密码混淆。

    <h2>14、baby.exe｜逆向栈构造</h2>
<h3>题目描述</h3>

4. 收集所有十六进制代码，批量转换为ASCII字符，拼接得到完整flag。<h3>考点总结</h3>
Windows入门逆向、栈字符串构造、汇编字节提取、十六进制转字符解码。
